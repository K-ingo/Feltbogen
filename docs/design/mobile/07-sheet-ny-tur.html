<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Feltbogen — Ny tur (mobil)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; font-family: Inter, sans-serif; background: #F9F5EB; color: #24362C; }
    .serif { font-family: Fraunces, serif; }
    .phone { max-width: 390px; margin: 0 auto; min-height: 100vh; position: relative; }
  </style>
</head>
<body>
<div class="phone">
  <!-- dimmed Ture behind -->
  <div class="px-5 pt-10 opacity-40 pointer-events-none">
    <h1 class="serif text-[28px]">Ture</h1>
    <p class="text-sm text-[#536055]">4 ture</p>
  </div>
  <div class="absolute inset-0 bg-[#24362C]/40" aria-hidden="true"></div>

  <!-- bottom sheet -->
  <div class="absolute bottom-0 inset-x-0 bg-[#F9F5EB] rounded-t-[20px] border border-[#315C45]/15 shadow-lg max-h-[92vh] flex flex-col">
    <div class="flex justify-center pt-2 pb-1">
      <span class="w-10 h-1 rounded-full bg-[#315C45]/25"></span>
    </div>
    <div class="px-5 pb-3 flex items-center justify-between border-b border-[#315C45]/10">
      <h1 class="serif text-2xl">Ny tur</h1>
      <a id="sheet-close" href="#close" class="text-[#536055] p-2" aria-label="Luk"><iconify-icon icon="lucide:x" class="text-lg"></iconify-icon></a>
    </div>

    <div class="px-5 py-4 space-y-4 overflow-y-auto flex-1">
      <p class="text-xs text-[#536055]">Ingen kladde før Opret — undgår tomme sync-fejl.</p>
      <div>
        <label for="trip-title" class="block text-[11px] uppercase tracking-wider text-[#536055] mb-1.5">Titel</label>
        <input id="trip-title" type="text" placeholder="Fx Fovslet Skov" class="w-full h-12 px-4 rounded-xl border border-[#315C45]/25 bg-white text-sm">
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label for="trip-from" class="block text-[11px] uppercase tracking-wider text-[#536055] mb-1.5">Fra</label>
          <input id="trip-from" type="text" placeholder="Dato" class="w-full h-11 px-3 rounded-xl border border-[#315C45]/15 bg-white text-sm">
        </div>
        <div>
          <label for="trip-to" class="block text-[11px] uppercase tracking-wider text-[#536055] mb-1.5">Til</label>
          <input id="trip-to" type="text" placeholder="Dato" class="w-full h-11 px-3 rounded-xl border border-[#315C45]/15 bg-white text-sm">
        </div>
      </div>
      <div>
        <label for="trip-place" class="block text-[11px] uppercase tracking-wider text-[#536055] mb-1.5">Sted</label>
        <input id="trip-place" type="text" placeholder="Valgfrit lige nu" class="w-full h-11 px-4 rounded-xl border border-[#315C45]/15 bg-white text-sm">
      </div>
      <div>
        <label for="trip-people" class="block text-[11px] uppercase tracking-wider text-[#536055] mb-1.5">Deltagere</label>
        <input id="trip-people" type="text" placeholder="Navne, kommasepareret" class="w-full h-11 px-4 rounded-xl border border-[#315C45]/15 bg-white text-sm">
      </div>
      <a id="toggle-more" href="#mere" class="inline-flex items-center gap-1 text-xs font-medium text-[#536055]">
        <iconify-icon icon="lucide:chevron-down"></iconify-icon> Flere detaljer
      </a>
    </div>

    <div class="px-5 py-4 border-t border-[#315C45]/10 flex gap-2 pb-6">
      <a id="btn-cancel" href="#annuller" class="flex-1 h-12 inline-flex items-center justify-center rounded-[10px] text-sm font-medium text-[#536055] border border-[#315C45]/15">Annuller</a>
      <a id="btn-create" href="#opret" class="flex-1 h-12 inline-flex items-center justify-center rounded-[10px] bg-[#315C45]/40 text-[#F9F5EB] text-sm font-medium" aria-disabled="true">Opret tur</a>
    </div>
  </div>
</div>
</body>
</html>
