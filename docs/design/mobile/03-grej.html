<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Feltbogen — Grej (mobil)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; font-family: Inter, sans-serif; background: #F9F5EB; color: #24362C; }
    .serif { font-family: Fraunces, serif; }
    .phone { max-width: 390px; margin: 0 auto; min-height: 100vh; position: relative; padding-bottom: 72px; }
  </style>
</head>
<body>
<div class="phone">

  <header class="px-5 pt-8 pb-3 flex items-start justify-between gap-3">
    <div>
      <h1 class="serif text-[28px]">Grej</h1>
      <p class="text-sm text-[#536055] mt-0.5">4 ting · 13,1 kg</p>
    </div>
    <a id="cta-tilfoej-grej" href="#tilfoej" class="h-11 px-4 inline-flex items-center rounded-[10px] bg-[#315C45] text-[#F9F5EB] text-sm font-medium shrink-0">+ Tilføj</a>
  </header>

  <a id="grejsaet-card" href="#grejsaet" class="mx-5 mb-4 block rounded-[12px] border border-[#315C45]/20 bg-white px-4 py-3">
    <div class="flex items-center justify-between">
      <div>
        <p class="text-sm font-semibold">Grejsæt</p>
        <p class="text-xs text-[#536055]">2 sæt · indlæs hele pakninger</p>
      </div>
      <span class="text-xs font-medium text-[#315C45]">Åbn</span>
    </div>
  </a>

  <div class="px-5 mb-3">
    <input id="search-grej" type="search" placeholder="Søg grej eller tags…" class="w-full h-11 px-4 rounded-xl border border-[#315C45]/15 bg-white text-sm">
  </div>

  <div class="px-5 flex gap-2 overflow-x-auto text-xs font-medium mb-4 pb-1">
    <a id="chip-ejer" href="#ejer" class="shrink-0 px-3 py-1.5 rounded-full bg-[#315C45] text-[#F9F5EB]">Ejer (4)</a>
    <a id="chip-vedligehold" href="#vedligehold" class="shrink-0 px-3 py-1.5 rounded-full bg-[#FFF4E0] text-[#A06000]">Vedligehold (4)</a>
    <a id="chip-indkoeb" href="#indkoeb" class="shrink-0 px-3 py-1.5 rounded-full bg-white border border-[#315C45]/20 text-[#536055]">Indkøb</a>
  </div>

  <div class="px-5 space-y-2 mb-6">
    <a id="row-ligge" href="#ligge" class="block rounded-[12px] border border-[#315C45]/12 bg-white px-4 py-3">
      <div class="flex items-start justify-between gap-2">
        <div>
          <p class="text-sm font-medium">test ligge underlag</p>
          <p class="text-xs text-[#536055] mt-0.5">575 g · 1.000 kr</p>
        </div>
        <span class="text-[10px] font-semibold uppercase px-1.5 py-0.5 rounded bg-[#FFF4E0] text-[#A06000]">Pas på</span>
      </div>
    </a>
    <a id="row-sove" href="#sove" class="block rounded-[12px] border border-[#315C45]/12 bg-white px-4 py-3">
      <div class="flex items-start justify-between gap-2">
        <div>
          <p class="text-sm font-medium">test sovepose</p>
          <p class="text-xs text-[#536055] mt-0.5">1.500 g · 1.000 kr</p>
        </div>
        <span class="text-[10px] font-semibold uppercase px-1.5 py-0.5 rounded bg-[#FFF4E0] text-[#A06000]">Pas på</span>
      </div>
    </a>
    <a id="row-taske" href="#taske" class="block rounded-[12px] border border-[#315C45]/12 bg-white px-4 py-3">
      <p class="text-sm font-medium">test taske</p>
      <p class="text-xs text-[#536055] mt-0.5">1.000 g · 1.000 kr</p>
    </a>
    <a id="row-testtest" href="#testtest" class="block rounded-[12px] border border-[#315C45]/12 bg-white px-4 py-3">
      <div class="flex items-start justify-between gap-2">
        <div>
          <p class="text-sm font-medium">Testtest</p>
          <p class="text-xs text-[#536055] mt-0.5">9.999 g</p>
        </div>
        <span class="text-[10px] font-semibold uppercase px-1.5 py-0.5 rounded bg-[#FFF4E0] text-[#A06000]">Pas på</span>
      </div>
    </a>
  </div>
<nav class="fixed bottom-0 inset-x-0 bg-[#F9F5EB]/95 border-t border-[#315C45]/12 backdrop-blur flex safe-pb z-20"><a id="tab-hjem" href="#hjem" class="flex-1 flex flex-col items-center gap-0.5 py-2 text-[#536055]  text-[10px]">
          <iconify-icon icon="lucide:home" class="text-xl"></iconify-icon>Hjem
        </a><a id="tab-ture" href="#ture" class="flex-1 flex flex-col items-center gap-0.5 py-2 text-[#536055]  text-[10px]">
          <iconify-icon icon="lucide:mountain" class="text-xl"></iconify-icon>Ture
        </a><a id="tab-grej" href="#grej" class="flex-1 flex flex-col items-center gap-0.5 py-2 text-[#315C45] font-semibold text-[10px]">
          <iconify-icon icon="lucide:backpack" class="text-xl"></iconify-icon>Grej
        </a><a id="tab-folk" href="#folk" class="flex-1 flex flex-col items-center gap-0.5 py-2 text-[#536055]  text-[10px]">
          <iconify-icon icon="lucide:users" class="text-xl"></iconify-icon>Folk
        </a><a id="tab-mere" href="#mere" class="flex-1 flex flex-col items-center gap-0.5 py-2 text-[#536055]  text-[10px]">
          <iconify-icon icon="lucide:more-horizontal" class="text-xl"></iconify-icon>Mere
        </a></nav></div></body></html>
